 por suas águas. O novo nascimento se manifesta por uma vida transformada. A justiça não produz a filiação. A filiação produz a justiça. Onde Cristo reina, a vida é moldada por Sua verdade. Onde o Salvador do Mundo habita, a justiça começa a florescer. Os seus rastros se tornam visíveis. A transformação se torna evidente. Cristo permanece perfeitamente justo.", "oracao": "Nós Te adoramos, ó Cordeiro Justo, pois a Tua justiça jamais conhece oscilação e o Teu julgamento é infalível. Tu és puro em Teu caráter, fiel em Tuas promessas e irrepreensível em Teus vereditos. Concede-nos a Graça de viver como filhos que refletem a obra que Tu realizaste em nosso interior. Que nossos pensamentos, palavras e atitudes sejam moldados pela verdade do Teu Evangelho, para que os frutos da nova vida se tornem visíveis diante dos homens.", "mov": 4}], "perguntas": {"Devocional": ["Como a verdade de que “Deus é luz, e não há nele treva nenhuma” confronta as áreas que tenho tentado esconder na minha vida espiritual oculta?", "Minha prática de confissão tem sido um ato religioso superficial ou um concordar sincero com Deus sobre a corrupção do meu coração?", "De que forma saber que tenho Jesus Cristo, o Justo, como meu Advogado intercedendo permanentemente junto ao Pai altera minha reação após uma falha ou pecado?", "Meu desejo de conhecer a Deus tem-se manifestado num amor ativo pela Sua Palavra ou apenas numa admiração intelectual abstrata?", "Onde, na minha vida, ainda procuro novidade quando Deus já me concedeu plenitude na Palavra recebida desde o princípio?"], "Comunidade": ["João afirma que andar na luz produz comunhão uns com os outros. Existe alguma mágoa ou falta de transparência entre mim e algum irmão que me empurre para a penumbra?", "Como podemos, enquanto comunidade, manifestar o testemunho concreto do “Verbo da vida” num mundo perdido em sombras e discursos vazios?", "Nossa comunhão tem sido baseada em afinidades humanas e passageiras ou na participação espiritual conjunta na vida do Pai e do Filho?", "De que forma o sangue de Jesus, que nos purifica de todo pecado, nos capacita a exercer graça e perdão mútuo na igreja local, eliminando o orgulho?", "Quem, entre nós, está caminhando para fora da comunhão? Como exercer discernimento sem cair no medo, lembrando que “a verdade permanece”?"], "Família": ["Como posso refletir a luz de Cristo no ambiente do meu lar, garantindo que minha profissão de fé com os lábios corresponda ao meu comportamento com os familiares?", "Estamos a construir uma cultura familiar de encobrimento de falhas (aparência de santidade) ou um ambiente seguro de confissão, arrependimento e graça soberana?", "Como o senhorio e os mandamentos de Cristo podem governar as decisões e as rotinas diárias da nossa casa esta semana?", "Sendo o amor a evidência da transformação gerada pelo novo nascimento, de que formas práticas minha família pode notar que o Verbo habita no meu coração através dos meus afetos e atitudes?", "“Não ameis o mundo.” Que afeições desordenadas têm disputado, em nosso lar, o lugar que pertence somente ao Pai?"]}, "caminhos": [{"t": "Andar na luz", "d": "Esta semana, trarei à luz, em confissão sincera diante de Deus, uma área que tenho mantido na penumbra — concordando com Ele, sem suavizar nem renomear o pecado."}, {"t": "Restaurar a comunhão", "d": "Procurarei um irmão de quem me afastei, removendo a barreira que me empurra para as trevas, lembrando que andar na luz produz comunhão uns com os outros."}, {"t": "Obedecer por amor", "d": "Escolherei um mandamento de Cristo que tenho negligenciado e o guardarei como resposta de gratidão — não para conquistar favor, mas porque O conheço."}, {"t": "Permanecer na Palavra", "d": "Reservarei um tempo diário para que a Palavra recebida desde o princípio habite em mim, recusando o fascínio das vozes que prometem novidade fora de Cristo."}]};

/* ============ ESTADO E NAVEGAÇÃO ============ */
const stage = document.getElementById('stage');
const rail = document.getElementById('rail');
let cur = 0;
let visited = new Set([0]);

// monta estações e trilha
stations.forEach((st,i)=>{
  stage.appendChild(renderStation(st,i));
  const d = document.createElement('button');
  d.className='dot'; d.setAttribute('role','tab');
  d.setAttribute('aria-label', railLabel(st,i));
  d.addEventListener('click', ()=>goTo(i));
  rail.appendChild(d);
});

function railLabel(st,i){
  if(st.type==='hero') return 'Abertura';
  if(st.type==='movcover') return 'Movimento '+st.mov;
  if(st.type==='pericope') return st.data.ref;
  if(st.type==='wheel') return 'Roda de Reflexão';
  if(st.type==='paths') return 'Caminhos da semana';
  if(st.type==='benc') return 'Bênção final';
  return 'Estação '+(i+1);
}

function applyTheme(key){
  const t = THEMES[key] || THEMES.hero;
  const root = document.documentElement.style;
  root.setProperty('--bg-a', t.a);
  root.setProperty('--bg-b', t.b);
  root.setProperty('--accent', t.accent);
  root.setProperty('--accent-soft', hexA(t.accent, .14));
  root.setProperty('--glow', hexA(t.accent, .24));
}
function hexA(hex, a){
  const h = hex.replace('#',''); const n = parseInt(h,16);
  const r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  return `rgba(${r},${g},${b},${a})`;
}

function goTo(i, push=true){
  if(i<0||i>=TOTAL) return;
  document.getElementById('st'+cur).classList.remove('show');
  cur=i; visited.add(i);
  const st = stations[cur];
  applyTheme(st.theme);
  const el = document.getElementById('st'+cur);
  el.classList.add('show');
  window.scrollTo({top:0, behavior:'smooth'});
  updateRail();
  document.getElementById('navCenter').textContent =
    cur===0 ? 'Início da jornada' :
    cur===TOTAL-1 ? 'Bênção final' :
    railLabel(st,cur);
  document.getElementById('prevBtn').disabled = cur===0;
  const nb = document.getElementById('nextBtn');
  nb.disabled = cur===TOTAL-1;
  nb.innerHTML = cur===TOTAL-2 ? 'Bênção ▸' : 'Avançar ▸';
  if(st.type==='wheel') initWheel();
  if(st.type==='paths') initPaths();
  saveState();
}
function updateRail(){
  [...rail.children].forEach((d,i)=>{
    d.classList.toggle('active', i===cur);
    d.classList.toggle('done', i<cur || (visited.has(i)&&i!==cur));
    if(i===cur) d.setAttribute('aria-selected','true'); else d.removeAttribute('aria-selected');
  });
  // mantém o ponto ativo visível
  const ad = rail.children[cur];
  if(ad) ad.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
}

document.getElementById('prevBtn').onclick=()=>goTo(cur-1);
document.getElementById('nextBtn').onclick=()=>goTo(cur+1);
document.addEventListener('keydown', e=>{
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag==='textarea'||tag==='input') return;
  if(e.key==='ArrowRight') goTo(cur+1);
  if(e.key==='ArrowLeft') goTo(cur-1);
});
// swipe
let tsx=0, tsy=0;
document.addEventListener('touchstart', e=>{tsx=e.changedTouches[0].clientX;tsy=e.changedTouches[0].clientY;}, {passive:true});
document.addEventListener('touchend', e=>{
  const dx=e.changedTouches[0].clientX-tsx, dy=e.changedTouches[0].clientY-tsy;
  if(Math.abs(dx)>64 && Math.abs(dx)>Math.abs(dy)*1.6){ if(dx<0) goTo(cur+1); else goTo(cur-1); }
}, {passive:true});

/* ============ RODA DE REFLEXÃO ============ */
let wheelInit=false;
let activeSphere=null;
let pools={}; // esfera -> array embaralhado restante
const spheresOrder = ['Devocional','Comunidade','Família'];

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function initWheel(){
  if(wheelInit) { renderRefList(); return; }
  wheelInit=true;
  const sc = document.getElementById('spheres');
  spheresOrder.forEach(name=>{
    pools[name]=shuffle(DATA.perguntas[name]);
    const b=document.createElement('button');
    b.className='sphere'; b.dataset.s=name;
    b.innerHTML=`${name} <span class="count">${DATA.perguntas[name].length}</span>`;
    b.onclick=()=>selectSphere(name);
    sc.appendChild(b);
  });
  document.getElementById('drawBtn').onclick=drawQ;
  document.getElementById('saveBtn').onclick=saveRef;
  document.getElementById('copyBtn').onclick=copyAll;
  document.getElementById('txtBtn').onclick=downloadTxt;
  document.getElementById('printBtn2').onclick=()=>preparePrint();
  document.getElementById('clearBtn').onclick=clearRefs;
  selectSphere('Devocional');
  renderRefList();
}
function selectSphere(name){
  activeSphere=name;
  [...document.querySelectorAll('.sphere')].forEach(b=>b.classList.toggle('active', b.dataset.s===name));
  updateCounts();
}
function updateCounts(){
  [...document.querySelectorAll('.sphere')].forEach(b=>{
    const n=b.dataset.s;
    b.querySelector('.count').textContent = pools[n].length;
  });
}
function drawQ(){
  if(!activeSphere) return;
  const draft = document.getElementById('ansText').value.trim();
  if(draft && !confirm('Há um registro não guardado. Sortear nova pergunta vai mantê-lo no campo, mas a pergunta mudará. Continuar?')) return;
  if(pools[activeSphere].length===0){ pools[activeSphere]=shuffle(DATA.perguntas[activeSphere]); toast('Esfera reembaralhada — todas já foram sorteadas.'); }
  const q = pools[activeSphere].shift();
  const card=document.getElementById('qcard');
  document.getElementById('qmeta').textContent = activeSphere + ' · vida ' + sphereWord(activeSphere);
  const qt=document.getElementById('qtext');
  qt.classList.remove('placeholder'); qt.textContent=q;
  card.dataset.q=q; card.dataset.sphere=activeSphere;
  updateCounts();
}
function sphereWord(s){return s==='Devocional'?'devocional (individual)':s==='Comunidade'?'comunitária (igreja e próximo)':'familiar (lar)';}

let refs = [];
function saveRef(){
  const card=document.getElementById('qcard');
  const q = card.dataset.q;
  if(!q){ toast('Sorteiem uma pergunta primeiro.'); return; }
  const a = document.getElementById('ansText').value.trim();
  if(!a){ toast('Escrevam a reflexão antes de guardar.'); return; }
  const author = document.getElementById('ansAuthor').value.trim();
  refs.unshift({sphere:card.dataset.sphere||activeSphere, q, a, author, ts:Date.now()});
  document.getElementById('ansText').value='';
  document.getElementById('ansAuthor').value='';
  renderRefList(); persistRefs();
  toast('Reflexão guardada.');
}
function renderRefList(){
  const ul=document.getElementById('reflist'); if(!ul) return;
  ul.innerHTML='';
  if(refs.length===0){
    ul.innerHTML='<li class="empty">Ainda não há reflexões guardadas. Sorteiem a primeira pergunta para começar.</li>';
    return;
  }
  refs.forEach((r,idx)=>{
    const li=document.createElement('li');
    li.innerHTML=`<div class="rl-meta"><span>${esc(r.sphere)}${r.author?' · <span class="rl-author">'+esc(r.author)+'</span>':''}</span>
      <button class="del" data-i="${idx}">remover</button></div>
      <div class="rl-q">“${esc(r.q)}”</div>
      <div class="rl-a">${esc(r.a)}</div>`;
    ul.appendChild(li);
  });
  ul.querySelectorAll('.del').forEach(b=>b.onclick=()=>{refs.splice(+b.dataset.i,1);renderRefList();persistRefs();});
}
function clearRefs(){
  if(refs.length && !confirm('Remover todas as reflexões guardadas neste dispositivo?')) return;
  refs=[]; renderRefList(); persistRefs(); toast('Reflexões removidas.');
}
function exportText(){
  const d=new Date().toLocaleDateString('pt-BR');
  let out=`O VERBO DA VIDA — Orações Matinais sobre 1 João\nReflexões do grupo · ${d}\n${'='.repeat(46)}\n\n`;
  if(refs.length===0) out+='(Nenhuma reflexão guardada.)\n';
  refs.slice().reverse().forEach((r,i)=>{
    out+=`${i+1}. [${r.sphere}${r.author?' — '+r.author:''}]\n   Pergunta: ${r.q}\n   Reflexão: ${r.a}\n\n`;
  });
  out+=`${'-'.repeat(46)}\n“E esta é a promessa que ele mesmo nos fez: a vida eterna.” (1 João 2.25)\nArisvaldo Marinho Cunha · Série Orações Matinais\n`;
  return out;
}
function downloadTxt(){
  const blob=new Blob([exportText()],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='reflexoes-1joao.txt';a.click();URL.revokeObjectURL(a.href);
  toast('Arquivo .txt baixado.');
}
async function copyAll(){
  try{ await navigator.clipboard.writeText(exportText()); toast('Copiado para a área de transferência.'); }
  catch(e){ toast('Não foi possível copiar automaticamente.'); }
}

/* ============ CAMINHOS ============ */
let pathsInit=false, pathState={};
function initPaths(){
  if(pathsInit){return;}
  pathsInit=true;
  const wrap=document.getElementById('paths');
  DATA.caminhos.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='path'; b.type='button'; b.setAttribute('aria-pressed', pathState[i]?'true':'false');
    b.innerHTML=`<h3>${esc(c.t)}</h3><p>${esc(c.d)}</p>
      <div class="state">${pathState[i]?'Caminho assumido':'Assumir este caminho'}</div>`;
    b.onclick=()=>{
      const on = b.getAttribute('aria-pressed')==='true';
      b.setAttribute('aria-pressed', on?'false':'true');
      b.querySelector('.state').textContent = on?'Assumir este caminho':'Caminho assumido';
      pathState[i]=!on; persistPaths();
    };
    wrap.appendChild(b);
  });
}

/* ============ TOAST ============ */
let toastT;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600);
}

/* ============ FONTE / APRESENTAÇÃO ============ */
const FS_STEPS=[0.9,1,1.15,1.32,1.5];
let fsIdx=1;
function applyFont(){document.documentElement.style.setProperty('--fs',FS_STEPS[fsIdx]);saveState();}
document.getElementById('fplus').onclick=()=>{fsIdx=Math.min(FS_STEPS.length-1,fsIdx+1);applyFont();};
document.getElementById('fminus').onclick=()=>{fsIdx=Math.max(0,fsIdx-1);applyFont();};
const presentBtn=document.getElementById('presentBtn');
presentBtn.onclick=()=>{
  const on=presentBtn.getAttribute('aria-pressed')==='true';
  presentBtn.setAttribute('aria-pressed', on?'false':'true');
  if(!on){ fsIdx=Math.max(fsIdx,3); applyFont(); } else { fsIdx=1; applyFont(); }
};
document.getElementById('printBtn').onclick=preparePrint;
function preparePrint(){
  // injeta, ao lado de cada textarea, o texto digitado para sair na impressão
  document.querySelectorAll('textarea').forEach(ta=>{
    let pa = ta.parentNode.querySelector('.print-answer');
    if(!pa){ pa=document.createElement('div'); pa.className='print-answer'; ta.parentNode.appendChild(pa); }
    pa.textContent = ta.value || '';
  });
  window.print();
}

/* ============ ÁUDIO ============ */
const audio=document.getElementById('audio');
const playBtn=document.getElementById('playBtn');
const vol=document.getElementById('vol');
const audLabel=document.getElementById('audLabel');
const audioPop=document.getElementById('audioPop');
let playing=false, fadeT;
audio.volume=0.45;
function setIcon(p){
  playBtn.innerHTML = p
    ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>'
    : '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
}
function fadeTo(target){
  clearInterval(fadeT);
  const step=(target-audio.volume)/14;
  fadeT=setInterval(()=>{
    let nv=audio.volume+step;
    if((step>0&&nv>=target)||(step<0&&nv<=target)){nv=target;clearInterval(fadeT);if(target===0)audio.pause();}
    audio.volume=Math.max(0,Math.min(1,nv));
  },36);
}
playBtn.onclick=()=>{
  audioPop.classList.remove('min');
  if(!playing){
    audLabel.textContent='Carregando...';
    const tv=parseFloat(vol.value);
    audio.volume=0; audio.play().then(()=>{
      playing=true; setIcon(true); fadeTo(tv);
      audLabel.textContent='Onde o Coração Descansa';
    }).catch(()=>{
      audLabel.textContent='Áudio indisponível';
      toast('Não foi possível iniciar a música. Verifique o arquivo de áudio.');
    });
  } else {
    fadeTo(0); playing=false; setIcon(false); audLabel.textContent='Música pausada';
  }
};
vol.oninput=()=>{ if(playing) audio.volume=parseFloat(vol.value); saveState(); };
document.getElementById('audMin').onclick=()=>audioPop.classList.add('min');

/* ============ PERSISTÊNCIA ============ */
const LS='oracoes_1joao_v1';
function persistRefs(){save();}
function persistPaths(){save();}
function saveState(){save();}
function save(){
  try{
    localStorage.setItem(LS, JSON.stringify({
      cur, visited:[...visited], fsIdx,
      vol: vol?parseFloat(vol.value):0.45,
      refs, pathState
    }));
  }catch(e){/* sandbox: degrada para sessão */}
}
function load(){
  try{
    const raw=localStorage.getItem(LS); if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){return null;}
}

/* ============ STARS ============ */
const cv=document.getElementById('stars');
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!reduce){
  const ctx=cv.getContext('2d'); let stars=[];
  function rs(){cv.width=innerWidth;cv.height=innerHeight;
    const n=Math.floor(innerWidth*innerHeight/9000);
    stars=Array.from({length:n},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height*0.85,
      r:Math.random()*1.3+0.2,p:Math.random()*Math.PI*2,sp:Math.random()*0.018+0.004}));}
  rs(); addEventListener('resize',rs);
  (function anim(){ctx.clearRect(0,0,cv.width,cv.height);
    stars.forEach(s=>{s.p+=s.sp;const o=0.3+Math.sin(s.p)*0.35;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(242,210,122,${Math.max(0,o)})`;ctx.fill();});
    requestAnimationFrame(anim);})();
}

/* ============ INIT ============ */
(function init(){
  const sv=load();
  if(sv){
    if(typeof sv.fsIdx==='number'){fsIdx=sv.fsIdx;}
    refs = Array.isArray(sv.refs)?sv.refs:[];
    pathState = sv.pathState||{};
    visited = new Set(sv.visited||[0]);
    if(vol && typeof sv.vol==='number'){vol.value=sv.vol; audio.volume=sv.vol;}
  }
  applyFont();
  // mostra primeira estação ou retoma
  const start = (sv && typeof sv.cur==='number' && sv.cur>0 && sv.cur<TOTAL) ? sv.cur : 0;
  document.getElementById('st0').classList.add('show'); // garante uma visível
  if(start!==0){ document.getElementById('st0').classList.remove('show'); }
  goTo(start, false);
  if(sv && refs.length){ setTimeout(()=>toast('Reflexões salvas neste dispositivo foram restauradas.'),700); }
})();
</script>
